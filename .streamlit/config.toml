# Pin the theme. Without this, Streamlit inherits the VIEWER's OS/browser dark
# mode and paints near-white text on our cream panels — every tab label,
# expander header and metric goes invisible on a reviewer's dark-mode machine.
# The app must look identical for everyone who opens the link.
[theme]
base = "light"
primaryColor = "#12752f"
backgroundColor = "#f2efe6"
secondaryBackgroundColor = "#ece8dc"
textColor = "#14140f"
font = "monospace"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true
